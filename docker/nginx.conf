server {
    listen 8082;
    server_name localhost;

    client_max_body_size 30M;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self' https:; frame-ancestors 'self';" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Root redirect
    location = / {
        return 301 /siquantank/;
    }

    # Root Favicon & Robots
    location = /favicon.ico {
        alias /usr/share/nginx/html/siquantank/favicon.ico;
    }

    location = /favicon-t.svg {
        alias /usr/share/nginx/html/siquantank/favicon-t.svg;
    }

    location = /robots.txt {
        alias /usr/share/nginx/html/siquantank/robots.txt;
    }

    # API Proxy to backend container
    location ^~ /siquantank/api/ {
        proxy_pass http://tank-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://tank-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media Uploads Proxy
    location ^~ /siquantank/uploads/ {
        proxy_pass http://tank-backend:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /uploads/ {
        proxy_pass http://tank-backend:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static Immutable Assets Caching
    location ^~ /siquantank/assets/ {
        alias /usr/share/nginx/html/siquantank/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static assets and SPA handling for /siquantank/
    location ^~ /siquantank/ {
        alias /usr/share/nginx/html/siquantank/;
        index index.html index.htm;
        try_files $uri $uri/ /siquantank/index.html;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

